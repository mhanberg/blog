name: Netlify Deploy

on:
  push:
  workflow_dispatch:
  schedule:
    # 6am ET, posts will publish if rebuilt after 1am ET
    - cron: "0 10 * * *"

jobs:
  build:
    env:
      HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
      GOODREADS_KEY: ${{ secrets.GOODREADS_KEY }}
      MIX_ENV: prod
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://mhanberg.cachix.org
            extra-trusted-public-keys = mhanberg.cachix.org-1:tpHVw70kbGnO5mGv4rA3pjxpqeEiP/vWfJT4tVaK85o=
            accept-flake-config = true
      - uses: cachix/cachix-action@f495f3ffa2f3810a92e5cc0abc2c5d6a2a07ec82 # v17
        with:
          name: mhanberg
          # If you chose API tokens for write access OR if you have a private cache
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false
          cachixArgs: "--verbose"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/flake.nix') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Remove stale goodreads data
        run: rm _build/books.bin

      - name: Install Dependencies
        run: nix develop .#netlify --command bash -c 'mix deps.get'

      - name: Build
        run: nix develop .#netlify --command bash -c 'mix build'

      - name: Deploy Branch Preview
        if: ${{ github.ref_name != 'main' }}
        run: nix develop .#netlify --command bash -c 'netlify deploy --alias ${{ github.ref_name}}'

      - name: Deploy Production
        if: ${{ github.ref_name == 'main' }}
        run: nix develop .#netlify --command bash -c 'netlify deploy --prod'
